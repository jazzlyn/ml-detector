---
name: build docker image

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths-ignore:
      - .github/**

jobs:
  docker-build:
    uses: techtales-io/github-workflows/.github/workflows/docker-build.yaml@7275b72af1540389d152b5a30298750d912c235e # v0.5.10
    permissions:
      contents: read
      packages: read
    with:
      runner: ubuntu-latest

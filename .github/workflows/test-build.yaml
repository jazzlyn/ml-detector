---
name: build docker image

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths-ignore:
      - .github/**

jobs:
  docker-build:
    uses: techtales-io/github-workflows/.github/workflows/docker-build.yaml@2d0a3c1c01cb846a7841e9cbe11f5ffd3a66fa6d # v0.5.0
    permissions:
      contents: read
      packages: read
    with:
      runner: ubuntu-latest

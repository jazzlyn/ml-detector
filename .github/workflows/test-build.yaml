---
name: build docker image

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths-ignore:
      - .github/**

jobs:
  docker-build:
    uses: techtales-io/github-workflows/.github/workflows/docker-build.yaml@126f6d2dadca32e3031693f223f08df897adf2d3 # v0.5.6
    permissions:
      contents: read
      packages: read
    with:
      runner: ubuntu-latest

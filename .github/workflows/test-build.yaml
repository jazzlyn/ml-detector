---
name: build docker image

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths-ignore:
      - .github/**

jobs:
  docker-build:
    uses: techtales-io/github-workflows/.github/workflows/docker-build.yaml@29c0fd460e4e29081d92bb31c232acf8e64136f9 # v0.5.9
    permissions:
      contents: read
      packages: read
    with:
      runner: ubuntu-latest

---
name: build docker image

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths-ignore:
      - .github/**

jobs:
  docker-build:
    uses: techtales-io/github-workflows/.github/workflows/docker-build.yaml@48578d0f0b3d8752d7757257783b5d4e6b3fd56f # v0.5.3
    permissions:
      contents: read
      packages: read
    with:
      runner: ubuntu-latest

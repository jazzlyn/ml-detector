---
name: build docker image

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths-ignore:
      - .github/**

jobs:
  docker-build:
    uses: techtales-io/github-workflows/.github/workflows/docker-build.yaml@32543b44ee214e89e422e08707b010d6a6b29451 # v0.5.2
    permissions:
      contents: read
      packages: read
    with:
      runner: ubuntu-latest

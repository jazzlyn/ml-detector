---
name: build docker image

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths-ignore:
      - .github/**

jobs:
  docker-build:
    uses: techtales-io/github-workflows/.github/workflows/docker-build.yaml@11e023e0bce4351f762fbc76f725ffe61162672b # v0.5.4
    permissions:
      contents: read
      packages: read
    with:
      runner: ubuntu-latest

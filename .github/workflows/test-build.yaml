---
name: build docker image

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths-ignore:
      - .github/**

jobs:
  docker-build:
    uses: techtales-io/github-workflows/.github/workflows/docker-build.yaml@2e6bcf9acd97ef3bc52ee0e4919656add4dc45ef # v0.5.7
    permissions:
      contents: read
      packages: read
    with:
      runner: ubuntu-latest
